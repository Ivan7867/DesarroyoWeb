<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌻 Plantas vs Zombis 🧟</title>
<style>
  :root{
    --sky-top:#8fd3f4;
    --sky-bottom:#c2e59c;
    --lawn-a:#7cc576;
    --lawn-b:#6cb866;
    --panel:#5b3a1e;
    --panel-light:#8a5a2e;
    --gold:#ffcc33;
    --danger:#d9453d;
    --cell-w:80px;
    --cell-h:90px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Segoe UI', Verdana, sans-serif;
    background:linear-gradient(180deg,var(--sky-top),var(--sky-bottom));
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:16px;
    user-select:none;
  }
  h1{
    margin:4px 0 12px 0;
    color:#2f4b1f;
    text-shadow:1px 1px 0 #fff;
  }

  /* ---------- TABS ---------- */
  .tabs{
    display:flex;
    gap:8px;
    margin-bottom:14px;
  }
  .tab-btn{
    padding:10px 22px;
    border:3px solid var(--panel);
    border-radius:10px 10px 0 0;
    background:var(--panel-light);
    color:#fff;
    font-weight:bold;
    font-size:15px;
    cursor:pointer;
    transition:0.15s;
  }
  .tab-btn:hover{ filter:brightness(1.1); }
  .tab-btn.active{
    background:var(--gold);
    color:#442200;
    border-color:var(--gold);
  }

  .tab-content{ display:none; }
  .tab-content.active{ display:flex; flex-direction:column; align-items:center; }

  /* ---------- DEFENSE MODE ---------- */
  #topbar{
    display:flex;
    align-items:center;
    gap:14px;
    background:var(--panel);
    border-radius:14px;
    padding:10px 16px;
    box-shadow:0 4px 10px rgba(0,0,0,0.3);
    margin-bottom:10px;
    flex-wrap:wrap;
    justify-content:center;
  }
  .stat{
    color:#fff;
    font-weight:bold;
    font-size:15px;
    background:rgba(255,255,255,0.1);
    padding:6px 12px;
    border-radius:8px;
  }
  #sun-count{ color:var(--gold); }

  #cards{
    display:flex;
    gap:8px;
  }
  .card{
    position:relative;
    width:70px;
    height:80px;
    background:linear-gradient(180deg,#c8a15b,#a67c3d);
    border:3px solid #7a5322;
    border-radius:8px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    transition:0.12s;
  }
  .card:hover{ transform:translateY(-2px); }
  .card.selected{
    border-color:var(--gold);
    box-shadow:0 0 10px var(--gold);
    transform:translateY(-3px);
  }
  .card.disabled{ filter:grayscale(0.8) brightness(0.7); cursor:not-allowed; }
  .card .emoji{ font-size:26px; }
  .card .cost{
    font-size:11px;
    background:#2e2e2e;
    color:var(--gold);
    padding:1px 6px;
    border-radius:6px;
    margin-top:2px;
  }
  .card .shake{ animation:shake 0.3s; }
  @keyframes shake{
    0%,100%{transform:translateX(0);}
    25%{transform:translateX(-4px);}
    75%{transform:translateX(4px);}
  }

  #restart-btn{
    background:var(--danger);
    color:#fff;
    border:none;
    padding:8px 14px;
    border-radius:8px;
    font-weight:bold;
    cursor:pointer;
  }

  #board-wrap{
    position:relative;
    width:calc(var(--cell-w) * 9);
    height:calc(var(--cell-h) * 5);
    border:5px solid var(--panel);
    border-radius:10px;
    overflow:hidden;
    box-shadow:0 8px 20px rgba(0,0,0,0.35);
  }
  #board{
    display:grid;
    grid-template-columns:repeat(9, var(--cell-w));
    grid-template-rows:repeat(5, var(--cell-h));
    position:relative;
    z-index:1;
  }
  .cell{
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
    border:1px solid rgba(0,0,0,0.05);
  }
  .cell.a{ background:var(--lawn-a); }
  .cell.b{ background:var(--lawn-b); }
  .cell:hover{ filter:brightness(1.08); cursor:pointer; }

  .plant{
    width:60px;
    height:78px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    font-size:34px;
    position:relative;
    animation:pop 0.25s;
  }
  @keyframes pop{ from{transform:scale(0);} to{transform:scale(1);} }
  .hp-bar-wrap{
    position:absolute;
    bottom:2px;
    width:44px;
    height:5px;
    background:rgba(0,0,0,0.35);
    border-radius:3px;
    overflow:hidden;
  }
  .hp-bar{
    height:100%;
    background:#4caf50;
  }

  #zombie-layer, #projectile-layer, #sun-layer{
    position:absolute;
    top:0; left:0;
    width:100%; height:100%;
    z-index:2;
    pointer-events:none;
  }
  #projectile-layer{ z-index:3; }
  #sun-layer{ z-index:5; pointer-events:none; }

  .zombie{
    position:absolute;
    width:50px;
    height:70px;
    font-size:38px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
  }
  .zombie .hp-bar-wrap{ width:44px; bottom:-4px; }

  .pea{
    position:absolute;
    width:16px;
    height:16px;
    font-size:16px;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  .sun{
    position:absolute;
    width:40px;
    height:40px;
    font-size:34px;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    pointer-events:auto;
    animation:bob 1.2s infinite ease-in-out;
    filter:drop-shadow(0 0 6px #fff59d);
  }
  @keyframes bob{ 0%,100%{transform:translateY(0);} 50%{transform:translateY(-6px);} }

  .floating-text{
    position:absolute;
    color:var(--gold);
    font-weight:bold;
    font-size:16px;
    text-shadow:1px 1px 2px #000;
    pointer-events:none;
    animation:floatUp 1s forwards;
    z-index:10;
  }
  @keyframes floatUp{
    from{ opacity:1; transform:translateY(0); }
    to{ opacity:0; transform:translateY(-40px); }
  }

  #gameover-overlay{
    position:fixed;
    top:0;left:0;width:100%;height:100%;
    background:rgba(0,0,0,0.75);
    display:none;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    z-index:100;
    color:#fff;
  }
  #gameover-overlay h2{ font-size:42px; color:var(--danger); margin-bottom:6px;}
  #gameover-overlay button{
    margin-top:16px;
    padding:12px 28px;
    font-size:16px;
    font-weight:bold;
    border:none;
    border-radius:10px;
    background:var(--gold);
    cursor:pointer;
  }

  /* ---------- ZEN MODE ---------- */
  #zen-topbar{
    display:flex;
    align-items:center;
    gap:14px;
    background:var(--panel);
    border-radius:14px;
    padding:10px 18px;
    margin-bottom:14px;
    color:#fff;
    font-weight:bold;
  }
  #coin-count{ color:var(--gold); }

  #zen-garden{
    display:grid;
    grid-template-columns:repeat(3, 170px);
    gap:18px;
  }
  .pot{
    background:#c8905a;
    border:4px solid #8a5a2e;
    border-radius:16px;
    padding:12px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:6px;
    min-height:190px;
    position:relative;
  }
  .pot .plant-display{
    font-size:44px;
    height:60px;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .pot .growth-bar-wrap{
    width:100%;
    height:8px;
    background:rgba(0,0,0,0.25);
    border-radius:4px;
    overflow:hidden;
  }
  .pot .growth-bar{
    height:100%;
    background:linear-gradient(90deg,#8bc34a,#4caf50);
    width:0%;
    transition:width 0.3s;
  }
  .pot-buttons{
    display:flex;
    gap:6px;
    margin-top:4px;
  }
  .zen-btn{
    border:none;
    border-radius:8px;
    padding:6px 10px;
    font-size:13px;
    font-weight:bold;
    cursor:pointer;
    background:#fff;
  }
  .zen-btn.water{ background:#64b5f6; color:#fff; }
  .zen-btn.fert{ background:#a1887f; color:#fff; }
  .zen-btn:disabled{ opacity:0.4; cursor:not-allowed; }
  .plant-pot-emoji{ font-size:40px; cursor:pointer; }
  .pot-label{ font-size:12px; color:#4b2e0e; font-weight:bold;}
</style>
</head>
<body>

<h1>🌻 Plantas vs Zombis 🧟</h1>

<div class="tabs">
  <button class="tab-btn active" data-tab="defensa">🛡️ Modo Defensa</button>
  <button class="tab-btn" data-tab="zen">🧘 Jardín Zen</button>
</div>

<!-- ===================== MODO DEFENSA ===================== -->
<div class="tab-content active" id="tab-defensa">
  <div id="topbar">
    <div class="stat">☀️ Soles: <span id="sun-count">50</span></div>
    <div class="stat">⏱️ Tiempo: <span id="time-count">0</span>s</div>
    <div id="cards">
      <div class="card" data-type="sunflower" title="Girasol - 50 soles">
        <div class="emoji">🌻</div>
        <div class="cost">50</div>
      </div>
      <div class="card" data-type="peashooter" title="Lanzaguisantes - 100 soles">
        <div class="emoji">🌱</div>
        <div class="cost">100</div>
      </div>
      <div class="card" data-type="wallnut" title="Nuez - 50 soles">
        <div class="emoji">🌰</div>
        <div class="cost">50</div>
      </div>
    </div>
    <button id="restart-btn">🔄 Reiniciar</button>
  </div>

  <div id="board-wrap">
    <div id="board"></div>
    <div id="zombie-layer"></div>
    <div id="projectile-layer"></div>
    <div id="sun-layer"></div>
  </div>
</div>

<!-- ===================== MODO ZEN ===================== -->
<div class="tab-content" id="tab-zen">
  <div id="zen-topbar">
    <div>🪙 Monedas: <span id="coin-count">0</span></div>
  </div>
  <div id="zen-garden"></div>
</div>

<!-- ===================== GAME OVER ===================== -->
<div id="gameover-overlay">
  <h2>💀 GAME OVER 💀</h2>
  <p>¡Los zombis invadieron tu jardín!</p>
  <button id="gameover-restart">Volver a intentar</button>
</div>

<script>
/* =========================================================================
   PLANTAS VS ZOMBIS - JUEGO COMPLETO EN VANILLA JS
   ========================================================================= */

/* -------------------- CONFIG GENERAL -------------------- */
const COLS = 9, ROWS = 5;
const CELL_W = 80, CELL_H = 90;
const BOARD_W = COLS * CELL_W;   // 720
const BOARD_H = ROWS * CELL_H;   // 450

const PLANT_TYPES = {
  sunflower:  { emoji:'🌻', cost:50,  hp:60,  produceInterval:8000, produceAmount:25 },
  peashooter: { emoji:'🌱', cost:100, hp:80,  shootInterval:1500,   damage:20, projSpeed:220 },
  wallnut:    { emoji:'🌰', cost:50,  hp:300 }
};

const ZOMBIE_TYPES = {
  normal: { emoji:'🧟', hp:100, speed:14 },      // px/segundo
  tough:  { emoji:'🧟‍♂️', hp:200, speed:10 }
};

/* -------------------- ESTADO DEL JUEGO -------------------- */
let state = null;
let tickInterval = null;
let idCounter = 1;
const nextId = () => idCounter++;

function createInitialState(){
  return {
    sun: 50,
    elapsed: 0,
    running: true,
    selectedType: null,
    plants: [],        // {id,row,col,type,hp,maxHp,el,lastShot,timer}
    zombies: [],        // {id,row,x,hp,maxHp,speed,type,el}
    projectiles: [],    // {id,row,x,damage,el}
    suns: [],            // {id,x,y,vy,resting,restTime,el}
    lastZombieSpawn: 0,
    zombieSpawnInterval: 5500,
    lastSunSpawn: 0
  };
}

/* -------------------- DOM REFS -------------------- */
const boardEl = document.getElementById('board');
const zombieLayer = document.getElementById('zombie-layer');
const projectileLayer = document.getElementById('projectile-layer');
const sunLayer = document.getElementById('sun-layer');
const sunCountEl = document.getElementById('sun-count');
const timeCountEl = document.getElementById('time-count');
const cardsEls = document.querySelectorAll('.card');
const gameoverOverlay = document.getElementById('gameover-overlay');

/* -------------------- INICIALIZACION DEL TABLERO -------------------- */
function buildBoardCells(){
  boardEl.innerHTML = '';
  for(let r=0; r<ROWS; r++){
    for(let c=0; c<COLS; c++){
      const cell = document.createElement('div');
      cell.className = 'cell ' + (((r+c)%2===0) ? 'a':'b');
      cell.dataset.row = r;
      cell.dataset.col = c;
      cell.addEventListener('click', onCellClick);
      boardEl.appendChild(cell);
    }
  }
}

function getCellEl(row, col){
  return boardEl.children[row*COLS + col];
}

/* -------------------- UTILIDADES -------------------- */
function rangesOverlap(aStart,aEnd,bStart,bEnd){
  return aStart < bEnd && aEnd > bStart;
}

function spawnFloatingText(layer, x, y, text){
  const el = document.createElement('div');
  el.className = 'floating-text';
  el.style.left = x+'px';
  el.style.top = y+'px';
  el.textContent = text;
  layer.appendChild(el);
  setTimeout(()=> el.remove(), 1000);
}

/* -------------------- SELECCION DE CARTAS -------------------- */
cardsEls.forEach(card=>{
  card.addEventListener('click', ()=>{
    if(!state || !state.running) return;
    const type = card.dataset.type;
    const cfg = PLANT_TYPES[type];
    if(state.sun < cfg.cost){
      card.classList.add('shake');
      setTimeout(()=>card.classList.remove('shake'), 300);
      return;
    }
    if(state.selectedType === type){
      state.selectedType = null;
    }else{
      state.selectedType = type;
    }
    refreshCardsUI();
  });
});

function refreshCardsUI(){
  cardsEls.forEach(card=>{
    const type = card.dataset.type;
    const cfg = PLANT_TYPES[type];
    card.classList.toggle('selected', state.selectedType === type);
    card.classList.toggle('disabled', state.sun < cfg.cost);
  });
}

/* -------------------- COLOCAR PLANTAS -------------------- */
function onCellClick(e){
  if(!state || !state.running) return;
  if(!state.selectedType) return;
  const row = parseInt(e.currentTarget.dataset.row);
  const col = parseInt(e.currentTarget.dataset.col);

  const occupied = state.plants.some(p=>p.row===row && p.col===col);
  if(occupied) return;

  const type = state.selectedType;
  const cfg = PLANT_TYPES[type];
  if(state.sun < cfg.cost) return;

  state.sun -= cfg.cost;

  const plant = {
    id: nextId(),
    row, col, type,
    hp: cfg.hp,
    maxHp: cfg.hp,
    lastShot: performance.now(),
    timer: 0
  };

  const cellEl = getCellEl(row, col);
  const plantEl = document.createElement('div');
  plantEl.className = 'plant';
  plantEl.innerHTML = `<div>${cfg.emoji}</div>
    <div class="hp-bar-wrap"><div class="hp-bar" style="width:100%"></div></div>`;
  cellEl.appendChild(plantEl);
  plant.el = plantEl;

  state.plants.push(plant);
  updateSunUI();
  refreshCardsUI();
}

/* -------------------- SOLES -------------------- */
function updateSunUI(){
  sunCountEl.textContent = state.sun;
  refreshCardsUI();
}

function spawnSun(x, y, fromPlant){
  const sun = {
    id: nextId(),
    x, y,
    vy: fromPlant ? 0 : 60,   // px/s cayendo
    restY: fromPlant ? y : (120 + Math.random()*180),
    resting: !!fromPlant,
    restTime: fromPlant ? performance.now() : null
  };
  const el = document.createElement('div');
  el.className = 'sun';
  el.textContent = '☀️';
  el.style.left = x+'px';
  el.style.top = y+'px';
  el.addEventListener('click', ()=> collectSun(sun));
  sunLayer.appendChild(el);
  sun.el = el;
  state.suns.push(sun);
}

function collectSun(sun){
  if(!state.suns.includes(sun)) return;
  state.sun += 25;
  spawnFloatingText(sunLayer, sun.x, sun.y, '+25');
  removeSun(sun);
  updateSunUI();
}

function removeSun(sun){
  sun.el.remove();
  state.suns = state.suns.filter(s=>s.id!==sun.id);
}

/* -------------------- ZOMBIS -------------------- */
function spawnZombie(){
  const row = Math.floor(Math.random()*ROWS);
  const isTough = state.elapsed > 30 && Math.random() < 0.3;
  const cfg = isTough ? ZOMBIE_TYPES.tough : ZOMBIE_TYPES.normal;

  const zombie = {
    id: nextId(),
    row,
    x: BOARD_W,
    hp: cfg.hp,
    maxHp: cfg.hp,
    speed: cfg.speed,
    emoji: cfg.emoji
  };

  const el = document.createElement('div');
  el.className = 'zombie';
  el.innerHTML = `<div>${cfg.emoji}</div>
    <div class="hp-bar-wrap"><div class="hp-bar" style="width:100%"></div></div>`;
  el.style.left = zombie.x+'px';
  el.style.top = (row*CELL_H + (CELL_H-70)/2)+'px';
  zombieLayer.appendChild(el);
  zombie.el = el;

  state.zombies.push(zombie);
}

/* -------------------- PROYECTILES -------------------- */
function spawnProjectile(row, x, damage){
  const proj = { id:nextId(), row, x, damage };
  const el = document.createElement('div');
  el.className = 'pea';
  el.textContent = '🟢';
  el.style.left = x+'px';
  el.style.top = (row*CELL_H + CELL_H/2 - 8)+'px';
  projectileLayer.appendChild(el);
  proj.el = el;
  state.projectiles.push(proj);
}

/* -------------------- LOOP PRINCIPAL -------------------- */
function startGameLoop(){
  tickInterval = setInterval(gameTick, 50);
}

function gameTick(){
  if(!state.running) return;
  const dt = 50;               // ms
  const dtSec = dt/1000;
  state.elapsed += dtSec;
  timeCountEl.textContent = Math.floor(state.elapsed);

  updatePlants(dt);
  updateZombies(dt);
  updateProjectiles(dt);
  updateFallingSuns(dt);
  handleSpawning();
}

/* ---- Plantas: producir sol y disparar ---- */
function updatePlants(dt){
  const now = performance.now();
  state.plants.forEach(p=>{
    const cfg = PLANT_TYPES[p.type];

    if(p.type === 'sunflower'){
      p.timer += dt;
      if(p.timer >= cfg.produceInterval){
        p.timer = 0;
        const cellRect = getCellEl(p.row,p.col);
        const x = p.col*CELL_W + CELL_W/2 - 20;
        const y = p.row*CELL_H + 10;
        spawnSun(x, y, true);
      }
    }

    if(p.type === 'peashooter'){
      const hasTarget = state.zombies.some(z=> z.row===p.row && z.x > p.col*CELL_W && z.hp>0);
      if(hasTarget && (now - p.lastShot) >= cfg.shootInterval){
        p.lastShot = now;
        spawnProjectile(p.row, p.col*CELL_W + CELL_W, cfg.damage);
      }
    }
  });
}

/* ---- Zombis: mover, comer plantas, condicion de derrota ---- */
function updateZombies(dt){
  const dtSec = dt/1000;
  for(let i = state.zombies.length-1; i>=0; i--){
    const z = state.zombies[i];
    const zWidth = 50;

    // buscar planta bloqueando
    let blockingPlant = null;
    for(const p of state.plants){
      if(p.row !== z.row) continue;
      const cellLeft = p.col*CELL_W;
      const cellRight = cellLeft + CELL_W;
      if(rangesOverlap(z.x, z.x+zWidth, cellLeft, cellRight)){
        blockingPlant = p;
        break;
      }
    }

    if(blockingPlant){
      // comer planta
      blockingPlant.hp -= 40 * dtSec;
      const pct = Math.max(0, blockingPlant.hp/blockingPlant.maxHp*100);
      blockingPlant.el.querySelector('.hp-bar').style.width = pct+'%';
      if(blockingPlant.hp <= 0){
        blockingPlant.el.remove();
        state.plants = state.plants.filter(p=>p.id!==blockingPlant.id);
      }
    }else{
      z.x -= z.speed * dtSec;
    }

    z.el.style.left = z.x+'px';

    if(z.x <= -10){
      triggerGameOver();
      return;
    }
  }
}

/* ---- Proyectiles: mover y colisionar ---- */
function updateProjectiles(dt){
  const dtSec = dt/1000;
  for(let i = state.projectiles.length-1; i>=0; i--){
    const proj = state.projectiles[i];
    proj.x += proj.damage ? 220*dtSec : 220*dtSec;
    proj.el.style.left = proj.x+'px';

    let hit = false;
    for(let j = state.zombies.length-1; j>=0; j--){
      const z = state.zombies[j];
      if(z.row !== proj.row) continue;
      if(rangesOverlap(proj.x, proj.x+16, z.x, z.x+50)){
        z.hp -= proj.damage;
        const pct = Math.max(0, z.hp/z.maxHp*100);
        z.el.querySelector('.hp-bar').style.width = pct+'%';
        if(z.hp <= 0){
          z.el.remove();
          state.zombies.splice(j,1);
        }
        hit = true;
        break;
      }
    }

    if(hit || proj.x > BOARD_W){
      proj.el.remove();
      state.projectiles.splice(i,1);
    }
  }
}

/* ---- Soles cayendo del cielo / de girasoles ---- */
function updateFallingSuns(dt){
  const dtSec = dt/1000;
  const now = performance.now();
  for(let i = state.suns.length-1; i>=0; i--){
    const sun = state.suns[i];
    if(!sun.resting){
      sun.y += sun.vy*dtSec;
      if(sun.y >= sun.restY){
        sun.y = sun.restY;
        sun.resting = true;
        sun.restTime = now;
      }
      sun.el.style.top = sun.y+'px';
    }else{
      if(now - sun.restTime > 8000){
        removeSun(sun);
      }
    }
  }
}

/* ---- Generacion periodica de zombis y soles del cielo ---- */
function handleSpawning(){
  const now = performance.now();

  if(now - state.lastZombieSpawn > state.zombieSpawnInterval){
    state.lastZombieSpawn = now;
    spawnZombie();
    // dificultad progresiva
    state.zombieSpawnInterval = Math.max(2200, 5500 - state.elapsed*20);
  }

  if(now - state.lastSunSpawn > 6500){
    state.lastSunSpawn = now;
    const x = 20 + Math.random()*(BOARD_W-60);
    spawnSun(x, -30, false);
  }
}

/* -------------------- GAME OVER -------------------- */
function triggerGameOver(){
  state.running = false;
  clearInterval(tickInterval);
  gameoverOverlay.style.display = 'flex';
}

document.getElementById('gameover-restart').addEventListener('click', ()=>{
  gameoverOverlay.style.display = 'none';
  resetGame();
});
document.getElementById('restart-btn').addEventListener('click', resetGame);

function resetGame(){
  clearInterval(tickInterval);
  zombieLayer.innerHTML = '';
  projectileLayer.innerHTML = '';
  sunLayer.innerHTML = '';
  idCounter = 1;
  state = createInitialState();
  buildBoardCells();
  updateSunUI();
  timeCountEl.textContent = '0';
  gameoverOverlay.style.display = 'none';
  startGameLoop();
}

/* =========================================================================
   MODO JARDIN ZEN
   ========================================================================= */
const ZEN_POT_COUNT = 6;
const FLOWER_EMOJIS = ['🌻','🌷','🌹','🌼','🌺','🪻'];
let zenCoins = 0;
let zenPots = [];
const zenGardenEl = document.getElementById('zen-garden');
const coinCountEl = document.getElementById('coin-count');

function buildZenGarden(){
  zenGardenEl.innerHTML = '';
  zenPots = [];
  for(let i=0;i<ZEN_POT_COUNT;i++){
    const pot = { id:i, planted:false, stage:0, growth:0, flower:null, fertUntil:0, coinTimer:0 };
    const potEl = document.createElement('div');
    potEl.className = 'pot';
    potEl.innerHTML = `
      <div class="pot-label">Maceta ${i+1}</div>
      <div class="plant-display"></div>
      <div class="growth-bar-wrap"><div class="growth-bar"></div></div>
      <div class="pot-buttons"></div>
    `;
    zenGardenEl.appendChild(potEl);
    pot.el = potEl;
    zenPots.push(pot);
    renderPot(pot);
  }
}

function stageEmoji(pot){
  if(!pot.planted) return '';
  if(pot.stage === 0) return '🌰';
  if(pot.stage === 1) return '🌱';
  if(pot.stage === 2) return '🌿';
  return pot.flower;
}

function renderPot(pot){
  const display = pot.el.querySelector('.plant-display');
  const bar = pot.el.querySelector('.growth-bar');
  const buttons = pot.el.querySelector('.pot-buttons');

  if(!pot.planted){
    display.innerHTML = `<span class="plant-pot-emoji" title="Plantar">🪴</span>`;
    display.querySelector('.plant-pot-emoji').onclick = ()=> plantSeed(pot);
    bar.style.width = '0%';
    buttons.innerHTML = '';
    return;
  }

  display.textContent = stageEmoji(pot);
  bar.style.width = pot.growth + '%';

  const fertReady = performance.now() > pot.fertUntil;
  buttons.innerHTML = `
    <button class="zen-btn water">💧 Regar</button>
    <button class="zen-btn fert" ${fertReady ? '' : 'disabled'}>🧪 Fertilizar</button>
  `;
  buttons.querySelector('.water').onclick = ()=> waterPot(pot);
  buttons.querySelector('.fert').onclick = ()=> fertilizePot(pot);
}

function plantSeed(pot){
  pot.planted = true;
  pot.stage = 0;
  pot.growth = 0;
  pot.flower = FLOWER_EMOJIS[Math.floor(Math.random()*FLOWER_EMOJIS.length)];
  pot.coinTimer = 0;
  renderPot(pot);
}

function updateStage(pot){
  if(pot.growth < 30) pot.stage = 0;
  else if(pot.growth < 60) pot.stage = 1;
  else if(pot.growth < 100) pot.stage = 2;
  else pot.stage = 3;
}

function waterPot(pot){
  pot.growth = Math.min(100, pot.growth + 15);
  updateStage(pot);
  renderPot(pot);
}

function fertilizePot(pot){
  if(performance.now() < pot.fertUntil) return;
  pot.growth = Math.min(100, pot.growth + 35);
  pot.fertUntil = performance.now() + 8000;
  updateStage(pot);
  renderPot(pot);
  setTimeout(()=> renderPot(pot), 8050);
}

function zenTick(){
  let changed = false;
  zenPots.forEach(pot=>{
    if(pot.planted && pot.stage === 3){
      pot.coinTimer += 1000;
      if(pot.coinTimer >= 5000){
        pot.coinTimer = 0;
        zenCoins += 2;
        changed = true;
        const rect = pot.el.getBoundingClientRect();
        spawnFloatingText(document.body, rect.left, rect.top, '+2 🪙');
      }
    }
  });
  if(changed){
    coinCountEl.textContent = zenCoins;
  }
}
setInterval(zenTick, 1000);

/* =========================================================================
   NAVEGACION ENTRE PESTAÑAS
   ========================================================================= */
document.querySelectorAll('.tab-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(c=>c.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('tab-'+btn.dataset.tab).classList.add('active');
  });
});

/* =========================================================================
   INICIALIZACION
   ========================================================================= */
resetGame();
buildZenGarden();
</script>
